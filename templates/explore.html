<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Library API Test</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #results { margin-top: 1.5rem; }
    .book { border: 1px solid #ddd; padding: 1rem; margin: 0.8rem 0; border-radius: 6px; }
    .search-controls { margin-bottom: 1rem; }
    select, input, button { padding: 0.6rem; margin-right: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
    .category-input { display: inline-block; margin-right: 1rem; vertical-align: top; }
    .category-input label { display: block; font-size: 0.9em; margin-bottom: 0.2rem; }
    .category-input input[type="text"] { width: 150px; }
    .category-input input[type="number"] { width: 80px; }
    #pagination-controls { text-align: center; margin-top: 1rem; }
    .languages { font-size: 0.8em; color: #888; font-style: italic; }
    .subjects { font-size: 0.8em; color: #666; }
    .editions { font-size: 0.8em; color: #999; }
  </style>
</head>
<body>
  <h1>Open Library Search Test</h1>
  <div class="search-controls">
    <div class="category-input">
      <label>Title</label>
      <input type="text" id="titleQuery" placeholder="e.g. Dune">
    </div>
    <div class="category-input">
      <label>Author</label>
      <input type="text" id="authorQuery" placeholder="e.g. Frank Herbert">
    </div>
    <div class="category-input">
      <label>ISBN</label>
      <input type="text" id="isbnQuery" placeholder="e.g. 9780441172719">
    </div>
    <div class="category-input">
      <label>Publisher</label>
      <input type="text" id="publisherQuery" placeholder="e.g. Chilton">
    </div>
    <div class="category-input">
      <label>Subject</label>
      <input type="text" id="subjectQuery" placeholder="e.g. Science Fiction">
    </div>
    <div class="category-input">
      <label>Year</label>
      <input type="number" id="yearQuery" placeholder="e.g. 1965" min="0" max="2100">
    </div>
    <select id="language">
      <option value="">All Languages</option>
      <option value="eng">English</option>
      <option value="fre">French</option>
      <option value="spa">Spanish</option>
      <option value="deu">German</option>
      <option value="ita">Italian</option>
      <option value="jpn">Japanese</option>
      <option value="chi">Chinese</option>
    </select>
    <select id="subjectFilter">
      <option value="">All Subjects</option>
      <option value="fiction">Fiction</option>
      <option value="mystery">Mystery</option>
      <option value="science fiction">Science Fiction</option>
      <option value="fantasy">Fantasy</option>
      <option value="biography">Biography</option>
      <option value="history">History</option>
    </select>
    <input type="number" id="yearMin" placeholder="Year Min" min="0" max="2100" style="width:80px;">
    <input type="number" id="yearMax" placeholder="Year Max" min="0" max="2100" style="width:80px;">
    <button onclick="search()">Search</button>
  </div>
  <div id="results"></div>
  <div id="pagination-controls">
    <button id="loadMore" onclick="loadMore()" style="display:none;">Load More</button>
  </div>
  <script>
    let currentOffset = 0;
    let currentQuery = '';
    let currentLang = '';
    let currentSubject = '';
    let currentYearMin = '';
    let currentYearMax = '';

    document.getElementById('subjectFilter').addEventListener('change', (e) => { currentSubject = e.target.value; });
    document.getElementById('yearMin').addEventListener('input', (e) => { currentYearMin = e.target.value; });
    document.getElementById('yearMax').addEventListener('input', (e) => { currentYearMax = e.target.value; });

    async function search(offset = 0) {
      const titleQ = document.getElementById('titleQuery').value.trim();
      const authorQ = document.getElementById('authorQuery').value.trim();
      const isbnQ = document.getElementById('isbnQuery').value.trim();
      const publisherQ = document.getElementById('publisherQuery').value.trim();
      const subjectQ = document.getElementById('subjectQuery').value.trim();
      const yearQ = document.getElementById('yearQuery').value.trim();
      const lang = document.getElementById('language').value;
      const yearMin = document.getElementById('yearMin').value;
      const yearMax = document.getElementById('yearMax').value;
     
      const queries = [];
      if (titleQ) queries.push(`title:"${titleQ}"`);
      if (authorQ) queries.push(`author:"${authorQ}"`);
      if (isbnQ) queries.push(`isbn:${isbnQ}`);
      if (publisherQ) queries.push(`publisher:"${publisherQ}"`);
      if (subjectQ) queries.push(`subject:"${subjectQ}"`);
      if (yearQ) queries.push(`first_publish_year:${yearQ}`);

      if (queries.length === 0 && offset === 0) {
        return alert("Enter at least one search term");
      }

      let searchQuery = queries.join(' AND ');

      if (lang) {
        searchQuery += ` AND language:${lang}`;
      }
      if (currentSubject) {
        searchQuery += ` AND subject:"${currentSubject}"`;
      }
      let yearRange = '';
      if (yearMin && yearMax) {
        yearRange = ` first_publish_year:[${yearMin} TO ${yearMax}]`;
      } else if (yearMin) {
        yearRange = ` first_publish_year:[${yearMin} TO *]`;
      } else if (yearMax) {
        yearRange = ` first_publish_year:[* TO ${yearMax}]`;
      }
      if (yearRange) {
        searchQuery += ` AND ${yearRange}`;
      }

      currentQuery = searchQuery;
      currentLang = lang;
      currentOffset = offset;

      const params = new URLSearchParams({
        q: searchQuery,
        limit: 6,
        offset: offset.toString(),
        fields: 'title,author_name,first_publish_year,language,subject,edition_count,cover_i'
      });
      const url = `https://openlibrary.org/search.json?${params}`;
      const container = document.getElementById('results');

      if (offset === 0) {
        container.innerHTML = '';
        document.getElementById('loadMore').style.display = 'none';
      }

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network error: " + response.status);
       
        const data = await response.json();

        if (offset === 0) {
          container.innerHTML = `<p>Found ${data.num_found} results.</p>`;
        }

        data.docs.forEach(book => {
          const div = document.createElement('div');
          div.className = 'book';
          const langs = book.language && Array.isArray(book.language) && book.language.length > 0 ? book.language.slice(0, 10).join(', ') : 'Unknown';
          let subs = 'No subjects';
          if (book.subject && Array.isArray(book.subject) && book.subject.length > 0) {
            subs = book.subject.slice(0, 5).join(', ');
          }
          const editions = book.edition_count ? `${book.edition_count} editions` : '1 edition';
          div.innerHTML = `
            <strong>${book.title || 'No title'}</strong><br>
            ${book.author_name ? 'By ' + book.author_name.join(', ') : 'Unknown author'}<br>
            ${book.first_publish_year ? 'First published: ' + book.first_publish_year : ''}<br>
            <span class="languages">Languages: ${langs}</span><br>
            <span class="subjects">Subjects: ${subs}</span><br>
            <span class="editions">${editions}</span><br>
            ${book.cover_i ? `<br><img src="https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg" alt="cover" style="max-width:120px; margin-top:0.5rem;">` : ''}
          `;
          container.appendChild(div);
        });

        if (data.docs.length === 0) {
          if (offset === 0) {
            container.innerHTML = '<p>No books found for this query.</p>';
          }
          return;
        }

        if (data.docs.length < 6) {
          container.innerHTML += '<p>No more results.</p>';
        } else {
          document.getElementById('loadMore').style.display = 'inline-block';
        }
      } catch (err) {
        if (offset === 0) {
          container.innerHTML = `<p style="color:red">Error: ${err.message}</p>`;
        } else {
          container.innerHTML += `<p style="color:red">Error loading more: ${err.message}</p>`;
        }
      }
    }

    function loadMore() {
      search(currentOffset + 6);
    }
  </script>
</body>
</html>
