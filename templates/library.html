<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library | HOMELIB</title>   
    <link rel="stylesheet" href="{{ url_for('static', filename='css/library.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section class="left-task-bar">
            <div>
                <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}" title="Graphic by Md Rubel Miah from Vecteezy.com">
            </div>
            <div class="list-items">
                <ul>
                    <a class="explore-item" href="{{ url_for('profile') }}"><li> <i class="fa-regular fa-circle-user"></i> Profile</li></a>
                    <a class="explore-item" href="{{ url_for('explore') }}"><li> <i class="fa-solid fa-magnifying-glass"></i> Explore</li></a>
                    <a class="dashboard-item" href="{{ url_for('dashboard') }}"><li> <i class="fa-solid fa-gauge"></i> Dashboard</li></a>
                    <a class="library-item" href="{{ url_for('library') }}"><li> <i class="fa-solid fa-book"></i> Library</li></a>
                    <a class="lists-item" href="{{ url_for('stats') }}"><li><i class="fa-solid fa-list"></i> Stats</li></a>
                    <a class="loans-item" href="{{ url_for('loan') }}"><li><i class="fa-regular fa-clipboard"></i> Loans</li></a>
                    <a class="manualentry-item" href="{{ url_for('manualentry') }}"><li><i class="fa-regular fa-clipboard"></i> Manual Add Book</li></a>
                </ul>
            </div>
        </section>
        <section class="main-content">
            <div class="title">
                <p class="title-text">My Library</p>
                <a href="{{ url_for('profile') }}"><img class="profile-img" src="{{ url_for('static', filename='images/meldin.jpeg') }}"></a>
                
            </div>
            <hr>
            
            <div class="shelves">
                <div class="shelves-container">
                    <button><span class="read-value shelf">10</span> Read</button>
                    <button><span class="reading-value shelf">10</span> Reading</button>
                    <button><span class="want-to-read-value shelf">10</span> Want to Read</button>
                    <button>Add Shelf</button>
                </div>
                <hr>
            </div>
            <div class="search-books">
                <div class="search-books-container">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input placeholder="Search books..." id="search">
                    <div id="suggestions" class="suggestions"></div>
                    <select class="shelves-sort">
                        <option value="all">All Shelves</option>
                    </select>

                    <select class="sort-by">
                        <option> Sort by</option>
                        <option value="">All Subjects</option>
                        <option value="fiction">Fiction</option>
                        <option value="non fiction">History</option>
                        <option value ="yearMin">Min Year</option>
                        <option value ="yearMax">Max Year</option>
                    </select>

                    <input type="hidden" id="titleQuery">
                    <input type="hidden" id="authorQuery">
                    <input type="hidden" id="isbnQuery">
                    <input type="hidden" id="publisherQuery">
                    <input type="hidden" id="subjectQuery">
                    <input type="hidden" id="yearQuery">
                    <select id="language" style="display:none;"><option value=""></option></select>

                    <button id="loadMore" style="display:none;" onclick="loadMore()">Load More</button>

                    <div id="results"></div>



                </div>
                <hr>
            </div>
           <div class="book-container">
                <div class="book-grid" id="displayLib">
                </div>
            </div>
        </section>
            </section>
    </main>
    <script src="{{ url_for('static', filename='js/library.js') }}" ></script>
</body>
</html>
