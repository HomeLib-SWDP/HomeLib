<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats | HOMELIB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/stats.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <section class="left-task-bar">
            <div>
                <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}" title="Graphic by Md Rubel Miah from Vecteezy.com">
            </div>

            <div class="list-items">
                <ul>
                    <a class="explore-item" href="{{ url_for('profile') }}"><li> <i class="fa-regular fa-circle-user"></i> Profile</li></a>
                    <a class="explore-item" href="{{ url_for('explore') }}"><li> <i class="fa-solid fa-magnifying-glass"></i> Explore</li></a>
                    <a class="library-item" href="{{ url_for('library') }}"><li> <i class="fa-solid fa-book"></i> Library</li></a>
                    <a class="lists-item" href="{{ url_for('stats') }}"><li><i class="fa-solid fa-list"></i> Stats</li></a>
                    <a class="loans-item" href="{{ url_for('loan') }}"><li><i class="fa-regular fa-clipboard"></i> Loans</li></a>
                </ul>
            </div>
        </section>

        
        <section class="main-content">
            <div class="title">
                <p class="title-text">My Stats</p>
                <a href="{{ url_for('profile') }}"><img class="profile-img" src="{{ url_for('static', filename='images/meldin.jpeg') }}"></a>
                
            </div>
            <hr>
            <div class="stats-container">
                <div class="books-read stat-tile">
                    <p class="stat-title">Books Read</p>
                    <p class="stat-month">This Month: <span class="span-month">0</span> </p> 
                    <p class="stat-year">This Year: <span class="span-year">0</span></p> 
                    <p class="stat-total">Total:<span class="span-total">0</span> </p> 
                </div>
                <div class="top-author stat-tile">
                    <p class="stat-title">Top Author</p>
                    <p class="stat-author">None</p>
                </div>
                <div class="top-genre stat-tile">
                    <p class="stat-title">Top Genre</p>
                    <p class="stat-genre">None</p>
                </div>
                <div class="reading-streak stat-tile">
                    <p class="stat-title">Reading Streak <i class="fa-solid fa-fire-flame-curved" style="color: rgb(255, 112, 37);"></i></p>
                    <p class="stat-days">0 days</p>
                </div>
                <div class="longest-book stat-tile">
                    <p class="stat-title">Longest Read Book</p>
                    <p class="stat-book">None</p>
                </div>
                <div class="pages-read stat-tile">
                    <p class="stat-title">Pages Read</p>
                    <p class="stat-pages">0</p>
                </div>
            </div>





        </section>
    </main>

    <script src="{{ url_for('static', filename='js/stats.js') }}"></script>
</body>
</html>
