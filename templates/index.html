<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HOMELIB</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
</head>
<body>
    <main>
        <section class="login-section">
            <div class="left-side">
                <img src="{{ url_for('static', filename='images/wp14066116.jpg') }}" class="login-img">
            </div>

            <div class="right-side">
                <div class="login-container">
                    <img class="logo" src="{{ url_for('static', filename='images/logo.png') }}" title="Graphic by Md Rubel Miah from Vecteezy.com">
                    <h1>Login</h1>
                    
                    <form id="loginForm">
                        <div>
                            <input type="email" id="email" name="email" required placeholder="Email Address">
                        </div>
                        <div>
                            <input type="password" id="password" name="password" required placeholder="Password">
                        </div>
                        <div class="forgot-password">
                            <a href="#">Forgot password?</a>
                        </div>
                        <button type="submit">Login</button>
                        <div class="need-account">
                            <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/login.js') }}" type="module"></script>
</body>
</html>
